name: Physical RDMA Transport Qualification

on:
  workflow_dispatch:
    inputs:
      server_address:
        description: Routable IP/RoCE address of mino-rdma-a
        required: true
        type: string
      client_address:
        description: Routable IP/RoCE address of mino-rdma-b
        required: true
        type: string
      server_node:
        description: Registry Node ID for mino-rdma-a
        required: true
        type: string
      client_node:
        description: Registry Node ID for mino-rdma-b
        required: true
        type: string
      server_security_domain:
        description: Security Domain for mino-rdma-a
        required: true
        type: string
      client_security_domain:
        description: Security Domain for mino-rdma-b (must differ)
        required: true
        type: string
      base_port:
        description: Four consecutive pre-authorized ports
        required: true
        default: "45106"
        type: string
      server_device:
        description: RDMA device name on mino-rdma-a
        required: true
        type: string
      client_device:
        description: RDMA device name on mino-rdma-b
        required: true
        type: string
      server_plugin:
        description: Absolute device-provider plugin path on mino-rdma-a
        required: true
        type: string
      client_plugin:
        description: Absolute device-provider plugin path on mino-rdma-b
        required: true
        type: string

      iterations:
        description: RTT iterations per payload and transport mode
        required: true
        default: "1000"
        type: string

permissions:
  contents: read

concurrency:
  group: mino-physical-rdma
  cancel-in-progress: false

env:
  QUALIFICATION_SESSION_NONCE: rdma-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
  INPUT_SERVER_ADDRESS: ${{ inputs.server_address }}
  INPUT_CLIENT_ADDRESS: ${{ inputs.client_address }}
  INPUT_SERVER_NODE: ${{ inputs.server_node }}
  INPUT_CLIENT_NODE: ${{ inputs.client_node }}
  INPUT_SERVER_SECURITY_DOMAIN: ${{ inputs.server_security_domain }}
  INPUT_CLIENT_SECURITY_DOMAIN: ${{ inputs.client_security_domain }}
  INPUT_BASE_PORT: ${{ inputs.base_port }}
  INPUT_SERVER_DEVICE: ${{ inputs.server_device }}
  INPUT_CLIENT_DEVICE: ${{ inputs.client_device }}
  INPUT_SERVER_PLUGIN: ${{ inputs.server_plugin }}
  INPUT_CLIENT_PLUGIN: ${{ inputs.client_plugin }}
  INPUT_ITERATIONS: ${{ inputs.iterations }}

jobs:
  server:
    name: RDMA qualification server (physical host A)
    runs-on: [self-hosted, linux, x64, mino-rdma-a]
    environment: physical-rdma
    timeout-minutes: 90
    env:
      CC: gcc-12
      CXX: g++-12
      APPROVED_PROVIDER_SHA256: ${{ vars.RDMA_PROVIDER_SHA256 }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          fetch-depth: 1
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3
      - name: Build tests and physical benchmark
        run: |
          bazel test --lockfile_mode=error --config=gcc12 \
            //mino/transport:rdma_driver_test --test_output=errors
          bazel build --lockfile_mode=error --config=gcc12 --config=release \
            //benchmarks/transport:transport_matrix_benchmark
      - name: Verify clean exact checkout including untracked files
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Run server matrix on the physical link
        run: |
          python3 benchmarks/transport/rdma_qualification.py \
            --benchmark="${GITHUB_WORKSPACE}/bazel-bin/benchmarks/transport/transport_matrix_benchmark" \
            --plugin="${INPUT_SERVER_PLUGIN}" \
            --approved-plugin-sha256="${APPROVED_PROVIDER_SHA256}" \
            --device="${INPUT_SERVER_DEVICE}" \
            --role=server \
            --server-address="${INPUT_SERVER_ADDRESS}" \
            --client-address="${INPUT_CLIENT_ADDRESS}" \
            --server-node="${INPUT_SERVER_NODE}" \
            --client-node="${INPUT_CLIENT_NODE}" \
            --server-security-domain="${INPUT_SERVER_SECURITY_DOMAIN}" \
            --client-security-domain="${INPUT_CLIENT_SECURITY_DOMAIN}" \
            --base-port="${INPUT_BASE_PORT}" \
            --iterations="${INPUT_ITERATIONS}" \
            --expected-commit="${GITHUB_SHA}" \
            --run-id="${GITHUB_RUN_ID}" \
            --run-attempt="${GITHUB_RUN_ATTEMPT}" \
            --session-nonce="${QUALIFICATION_SESSION_NONCE}" \
            --sla-policy=benchmarks/transport/transport_qualification_sla.json \
            --output-dir="${RUNNER_TEMP}/mino-rdma-server-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Upload server role artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdma-qualification-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mino-rdma-server-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 180

  client:
    name: RDMA qualification client (physical host B)
    runs-on: [self-hosted, linux, x64, mino-rdma-b]
    environment: physical-rdma
    timeout-minutes: 90
    env:
      CC: gcc-12
      CXX: g++-12
      APPROVED_PROVIDER_SHA256: ${{ vars.RDMA_PROVIDER_SHA256 }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          fetch-depth: 1
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3
      - name: Build tests and physical benchmark
        run: |
          bazel test --lockfile_mode=error --config=gcc12 \
            //mino/transport:rdma_driver_test --test_output=errors
          bazel build --lockfile_mode=error --config=gcc12 --config=release \
            //benchmarks/transport:transport_matrix_benchmark
      - name: Verify clean exact checkout including untracked files
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Allow host A to enter the first blocking accept
        run: sleep 30
      - name: Run client matrix and enforce independent SLAs
        run: |
          python3 benchmarks/transport/rdma_qualification.py \
            --benchmark="${GITHUB_WORKSPACE}/bazel-bin/benchmarks/transport/transport_matrix_benchmark" \
            --plugin="${INPUT_CLIENT_PLUGIN}" \
            --approved-plugin-sha256="${APPROVED_PROVIDER_SHA256}" \
            --device="${INPUT_CLIENT_DEVICE}" \
            --role=client \
            --server-address="${INPUT_SERVER_ADDRESS}" \
            --client-address="${INPUT_CLIENT_ADDRESS}" \
            --server-node="${INPUT_SERVER_NODE}" \
            --client-node="${INPUT_CLIENT_NODE}" \
            --server-security-domain="${INPUT_SERVER_SECURITY_DOMAIN}" \
            --client-security-domain="${INPUT_CLIENT_SECURITY_DOMAIN}" \
            --base-port="${INPUT_BASE_PORT}" \
            --iterations="${INPUT_ITERATIONS}" \
            --expected-commit="${GITHUB_SHA}" \
            --run-id="${GITHUB_RUN_ID}" \
            --run-attempt="${GITHUB_RUN_ATTEMPT}" \
            --session-nonce="${QUALIFICATION_SESSION_NONCE}" \
            --sla-policy=benchmarks/transport/transport_qualification_sla.json \
            --output-dir="${RUNNER_TEMP}/mino-rdma-client-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Upload client role artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdma-qualification-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mino-rdma-client-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 180

  final:
    name: Finalize RDMA qualification evidence
    if: always()
    needs: [server, client]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact finalizer and SLA policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          fetch-depth: 1
      - name: Verify clean exact finalizer checkout
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Download server role artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rdma-qualification-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/server
      - name: Download client role artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rdma-qualification-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/client
      - name: Fail-closed cross-check and write final manifest
        run: |
          python3 benchmarks/transport/transport_qualification.py \
            --qualification=rdma \
            --server-root=evidence/server \
            --client-root=evidence/client \
            --policy=benchmarks/transport/transport_qualification_sla.json \
            --expected-commit="${GITHUB_SHA}" \
            --expected-run-id="${GITHUB_RUN_ID}" \
            --expected-run-attempt="${GITHUB_RUN_ATTEMPT}" \
            --out=evidence/final/manifest.json
      - name: Archive role artifacts and final manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rdma-qualification-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 180
