name: Schema Extended Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 0"
  push:
    branches: [master, main]
    paths:
      - .github/workflows/schema-extended-validation.yml
      - .bazelrc
      - MODULE.bazel
      - MODULE.bazel.lock
      - mino/schema/**
      - schemas/**
      - tools/ci/collect_codegen_artifacts.py
      - tools/ci/docker/**
      - tools/ci/prepare_schema_fuzz_corpus.py
      - tools/ci/run_schema_codegen_docker_check.py
      - tools/ci/run_schema_codegen_environment.sh
      - tools/ci/run_schema_fuzz_campaign.py
      - tools/minoc/**
  pull_request:
    branches: [master, main]
    paths:
      - .github/workflows/schema-extended-validation.yml
      - .bazelrc
      - MODULE.bazel
      - MODULE.bazel.lock
      - mino/schema/**
      - schemas/**
      - tools/ci/collect_codegen_artifacts.py
      - tools/ci/docker/**
      - tools/ci/prepare_schema_fuzz_corpus.py
      - tools/ci/run_schema_codegen_docker_check.py
      - tools/ci/run_schema_codegen_environment.sh
      - tools/ci/run_schema_fuzz_campaign.py
      - tools/minoc/**

permissions:
  contents: read

concurrency:
  group: schema-extended-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codegen:
    name: CodeGen ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu22-gcc12
            os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
            packages: gcc-12 g++-12 libatomic1
            jobs: 1
            extra_config: --config=gcc12
            checkout_path: checkout-gcc
            tz: UTC
            source_date_epoch: 0
          - id: ubuntu24-clang18
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            packages: clang-18 libatomic1
            jobs: 4
            extra_config: ""
            checkout_path: nested/checkout-clang
            tz: Pacific/Auckland
            source_date_epoch: 2147483647

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      TZ: ${{ matrix.tz }}
      LANG: C.UTF-8
      SOURCE_DATE_EPOCH: ${{ matrix.source_date_epoch }}
      MINO_CODEGEN_ENV_PROBE: ${{ matrix.id }}

    steps:
      - name: Checkout into environment-specific path
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ${{ matrix.checkout_path }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3

      - name: Record CodeGen evidence start
        run: echo "CODEGEN_STARTED_EPOCH=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Run existing hermetic CodeGen tests
        id: codegen-test
        working-directory: ${{ matrix.checkout_path }}
        run: |
          mkdir -p codegen-logs
          set +e
          bazel test --lockfile_mode=error --config=release ${{ matrix.extra_config }} --jobs=${{ matrix.jobs }} \
            //mino/schema/codegen:code_generator_test \
            //tools/minoc:canonical_wire_generated_test \
            //tools/minoc:minoc_cli_test \
            //tools/minoc:cross_directory_generated_test \
            --test_output=errors 2>&1 | tee codegen-logs/test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

      - name: Build all compared CodeGen output groups
        id: codegen-build
        if: always()
        working-directory: ${{ matrix.checkout_path }}
        run: |
          mkdir -p codegen-logs
          set +e
          bazel build --lockfile_mode=error --config=release ${{ matrix.extra_config }} --jobs=${{ matrix.jobs }} \
            --output_groups=default,descriptor \
            //tools/minoc:sample_codegen \
            //tools/minoc:canonical_wire_codegen \
            //tools/minoc:mangling_codegen \
            //tools/minoc:sensor_frame_codegen \
            //mino/schema/fuzz:codegen_golden 2>&1 | tee codegen-logs/build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

      - name: Verify CodeGen build did not mutate locked inputs
        if: always()
        working-directory: ${{ matrix.checkout_path }}
        run: git --no-pager diff --exit-code -- MODULE.bazel MODULE.bazel.lock .bazelrc

      - name: Collect logical CodeGen artifacts
        id: codegen-collect
        if: always()
        working-directory: ${{ matrix.checkout_path }}
        run: |
          set +e
          python3 tools/ci/collect_codegen_artifacts.py \
            --config=release \
            --out=hermetic-codegen
          code=$?
          mkdir -p hermetic-codegen
          cp codegen-logs/*.log hermetic-codegen/ 2>/dev/null || true
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "checkout_path=${{ matrix.checkout_path }}"
            echo "jobs=${{ matrix.jobs }}"
            echo "tz=${TZ}"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH}"
            uname -a
            bazel --version
            ${{ matrix.cxx }} --version
          } > hermetic-codegen/PROVENANCE.txt
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

      - name: Write CodeGen artifact manifest
        if: always()
        working-directory: ${{ matrix.checkout_path }}
        env:
          CODEGEN_ENVIRONMENT: ${{ matrix.id }}
          CODEGEN_EXTRA_CONFIG: ${{ matrix.extra_config }}
          CODEGEN_JOBS: ${{ matrix.jobs }}
          CODEGEN_TEST_EXIT_CODE: ${{ steps.codegen-test.outputs.exit_code }}
          CODEGEN_BUILD_EXIT_CODE: ${{ steps.codegen-build.outputs.exit_code }}
          CODEGEN_COLLECT_EXIT_CODE: ${{ steps.codegen-collect.outputs.exit_code }}
          CODEGEN_TEST_OUTCOME: ${{ steps.codegen-test.outcome }}
          CODEGEN_BUILD_OUTCOME: ${{ steps.codegen-build.outcome }}
          CODEGEN_COLLECT_OUTCOME: ${{ steps.codegen-collect.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import time

          output = Path("hermetic-codegen")
          output.mkdir(parents=True, exist_ok=True)
          logs = {}
          for name in ("test.log", "build.log"):
              path = output / name
              logs[name] = {
                  "sha256": (
                      hashlib.sha256(path.read_bytes()).hexdigest()
                      if path.is_file() else None
                  ),
                  "size_bytes": path.stat().st_size if path.is_file() else None,
              }
          def step_exit_code(name):
              raw = os.environ.get(name, "")
              try:
                  return int(raw)
              except ValueError:
                  return 125

          exit_codes = {
              "test": step_exit_code("CODEGEN_TEST_EXIT_CODE"),
              "build": step_exit_code("CODEGEN_BUILD_EXIT_CODE"),
              "collect": step_exit_code("CODEGEN_COLLECT_EXIT_CODE"),
          }
          overall_exit_code = next(
              (code for code in exit_codes.values() if code != 0), 0
          )
          extra_config = os.environ["CODEGEN_EXTRA_CONFIG"]
          config = ["--config=release"]
          if extra_config:
              config.append(extra_config)
          jobs = f"--jobs={os.environ['CODEGEN_JOBS']}"
          manifest = {
              "schema_version": 1,
              "suite": "schema-codegen-determinism",
              "environment": os.environ["CODEGEN_ENVIRONMENT"],
              "commit": os.environ["GITHUB_SHA"],
              "seed": None,
              "seed_consumed": False,
              "command": [
                  [
                      "bazel", "test", *config, jobs,
                      "//mino/schema/codegen:code_generator_test",
                      "//tools/minoc:canonical_wire_generated_test",
                      "//tools/minoc:minoc_cli_test",
                      "//tools/minoc:cross_directory_generated_test",
                      "--test_output=errors",
                  ],
                  [
                      "bazel", "build", *config, jobs,
                      "--output_groups=default,descriptor",
                      "//tools/minoc:sample_codegen",
                      "//tools/minoc:canonical_wire_codegen",
                      "//tools/minoc:mangling_codegen",
                      "//tools/minoc:sensor_frame_codegen",
                      "//mino/schema/fuzz:codegen_golden",
                  ],
              ],
              "requested_duration_seconds": None,
              "elapsed_seconds": round(
                  time.time()
                  - int(os.environ.get("CODEGEN_STARTED_EPOCH", int(time.time()))),
                  3,
              ),
              "outcome": "passed" if overall_exit_code == 0 else "failed",
              "exit_code": overall_exit_code,
              "step_exit_codes": exit_codes,
              "step_outcomes": {
                  "test": os.environ.get("CODEGEN_TEST_OUTCOME"),
                  "build": os.environ.get("CODEGEN_BUILD_OUTCOME"),
                  "collect": os.environ.get("CODEGEN_COLLECT_OUTCOME"),
              },
              "github": {
                  key.lower(): os.environ.get(key)
                  for key in (
                      "GITHUB_ACTIONS", "GITHUB_EVENT_NAME", "GITHUB_JOB",
                      "GITHUB_REF", "GITHUB_REPOSITORY", "GITHUB_WORKFLOW",
                      "GITHUB_RUN_ATTEMPT",
                      "GITHUB_RUN_ID", "GITHUB_RUN_NUMBER", "GITHUB_SHA",
                      "RUNNER_ARCH", "RUNNER_NAME", "RUNNER_OS",
                  )
              },
              "logs": logs,
              "generated_outputs_root_sha256": (
                  (output / "ROOT_SHA256").read_text(encoding="ascii").strip()
                  if (output / "ROOT_SHA256").is_file() else None
              ),
          }
          (output / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload CodeGen bytes and hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schema-codegen-${{ matrix.id }}
          path: ${{ matrix.checkout_path }}/hermetic-codegen
          if-no-files-found: error
          retention-days: 90

  compare-codegen:
    name: Strict CodeGen hash comparison
    needs: codegen
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Download GCC artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: schema-codegen-ubuntu22-gcc12
          path: compare/ubuntu22-gcc12

      - name: Download Clang artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: schema-codegen-ubuntu24-clang18
          path: compare/ubuntu24-clang18

      - name: Compare exactly 15 logical outputs
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import sys

          expected_count = 15
          roots = {
              "ubuntu22-gcc12": Path("compare/ubuntu22-gcc12"),
              "ubuntu24-clang18": Path("compare/ubuntu24-clang18"),
          }
          output = Path("codegen-comparison")
          output.mkdir(parents=True, exist_ok=True)
          errors = []
          environments = {}
          manifests = {}
          line_pattern = re.compile(r"^([0-9a-f]{64})  (.+)$")

          for name, root in roots.items():
              manifest_path = root / "SHA256SUMS"
              root_path = root / "ROOT_SHA256"
              entries = {}
              manifest_bytes = b""
              declared_root = None
              try:
                  manifest_bytes = manifest_path.read_bytes()
                  for line_number, line in enumerate(
                      manifest_bytes.decode("utf-8").splitlines(), start=1
                  ):
                      match = line_pattern.fullmatch(line)
                      if match is None:
                          errors.append(
                              f"{name}: malformed SHA256SUMS line {line_number}"
                          )
                          continue
                      digest, logical_path = match.groups()
                      if logical_path in entries:
                          errors.append(f"{name}: duplicate output {logical_path}")
                      entries[logical_path] = digest
                  declared_root = root_path.read_text(encoding="ascii").strip()
              except (OSError, UnicodeError) as error:
                  errors.append(f"{name}: unable to read hashes: {error}")

              computed_root = hashlib.sha256(manifest_bytes).hexdigest()
              if declared_root != computed_root:
                  errors.append(
                      f"{name}: ROOT_SHA256 does not hash SHA256SUMS "
                      f"(declared={declared_root}, computed={computed_root})"
                  )
              if len(entries) != expected_count:
                  errors.append(
                      f"{name}: expected {expected_count} outputs, found {len(entries)}"
                  )
              manifests[name] = entries
              environments[name] = {
                  "declared_root_sha256": declared_root,
                  "computed_root_sha256": computed_root,
                  "manifest_sha256": computed_root,
                  "output_count": len(entries),
              }

          gcc = manifests["ubuntu22-gcc12"]
          clang = manifests["ubuntu24-clang18"]
          all_paths = sorted(set(gcc) | set(clang))
          comparisons = [
              {
                  "path": path,
                  "ubuntu22_gcc12_sha256": gcc.get(path),
                  "ubuntu24_clang18_sha256": clang.get(path),
                  "match": gcc.get(path) == clang.get(path),
              }
              for path in all_paths
          ]
          mismatches = [entry for entry in comparisons if not entry["match"]]
          if mismatches:
              errors.append(f"{len(mismatches)} logical outputs differ")

          passed = not errors and len(comparisons) == expected_count
          report = {
              "schema_version": 1,
              "commit": os.environ["COMMIT_SHA"],
              "expected_output_count": expected_count,
              "compared_output_count": len(comparisons),
              "environments": environments,
              "outputs": comparisons,
              "result": {
                  "passed": passed,
                  "mismatch_count": len(mismatches),
                  "errors": errors,
              },
          }
          report_bytes = (
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          ).encode("utf-8")
          (output / "comparison.json").write_bytes(report_bytes)
          comparison_root = hashlib.sha256(report_bytes).hexdigest()
          (output / "ROOT_SHA256").write_text(
              comparison_root + "\n", encoding="ascii"
          )

          status = "PASS" if passed else "FAIL"
          summary = [
              "## Schema CodeGen deterministic comparison",
              "",
              f"**{status}** — compared {len(comparisons)}/{expected_count} expected outputs.",
              "",
              "| Environment | Outputs | ROOT SHA-256 |",
              "|---|---:|---|",
          ]
          for name, evidence in environments.items():
              summary.append(
                  f"| `{name}` | {evidence['output_count']} | "
                  f"`{evidence['declared_root_sha256']}` |"
              )
          summary.extend(
              [
                  "",
                  f"Comparison JSON SHA-256: `{comparison_root}`",
                  f"Mismatched outputs: **{len(mismatches)}**",
              ]
          )
          if errors:
              summary.extend(["", "### Errors"])
              summary.extend(f"- {error}" for error in errors)
          summary_text = "\n".join(summary) + "\n"
          (output / "summary.md").write_text(summary_text, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as job_summary:
              job_summary.write(summary_text)

          if not passed:
              sys.exit(1)
          PY

      - name: Upload CodeGen comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schema-codegen-comparison-${{ github.run_id }}
          path: codegen-comparison
          if-no-files-found: warn
          retention-days: 90

  fuzz:
    name: ${{ matrix.sanitizer }} libFuzzer (${{ github.event_name == 'pull_request' && '60s smoke' || '1h' }})
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]

    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '3600' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GitHub's Ubuntu 22.04 image already provides Clang and compiler-rt.
      # Only the project runtime dependency needs an explicit package install.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3


      - name: Run sanitizer fuzz campaign
        run: |
          if [ "${FUZZ_SECONDS}" = "3600" ]; then
            python3 tools/ci/run_schema_fuzz_campaign.py \
              --sanitizer=${{ matrix.sanitizer }} \
              --seconds="${FUZZ_SECONDS}" \
              --seed=${{ github.run_number }} \
              --out=fuzz-evidence-${{ matrix.sanitizer }} \
              --minimize \
              --clean
          else
            python3 tools/ci/run_schema_fuzz_campaign.py \
              --sanitizer=${{ matrix.sanitizer }} \
              --seconds="${FUZZ_SECONDS}" \
              --seed=${{ github.run_number }} \
              --out=fuzz-evidence-${{ matrix.sanitizer }} \
              --clean
          fi

      - name: Upload fuzz evidence and reproducers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schema-fuzz-${{ matrix.sanitizer }}-${{ github.run_id }}
          path: fuzz-evidence-${{ matrix.sanitizer }}
          if-no-files-found: warn
          retention-days: 90
