# Mino CI（开发计划 D0-03）
#
# 触发：push 到 master/main + pull_request
# 矩阵：debug / release / asan / ubsan / tsan 五配置（sanitizer 互斥，分 job 运行）
# 缓存：actions/cache 缓存 Bazel output base 与 repository cache
# Lint：buildifier 检查 BUILD 文件格式（可选）

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 同一分支的新 push 自动取消进行中的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 构建 + 测试矩阵：五配置分 job（sanitizer 之间互斥，禁止同进程叠加）
  # -------------------------------------------------------------------------
  build-test:
    name: ${{ matrix.config }} (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release, asan, ubsan, tsan]

    env:
      CC: gcc-12
      CXX: g++-12

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 libatomic1

      # Bazelisk 读取 .bazelversion 锁定 Bazel 版本，保证构建可复现。
      # 该 action 同时缓存下载的 Bazel 发行版。
      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3

      # 缓存 Bazel output base（~/.cache/bazel）：含外部分析仓库与构建产物。
      # key 含配置名避免跨 sanitizer 配置产物互相污染。
      - name: Cache Bazel output base
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', '.bazelversion') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.config }}-
            bazel-${{ runner.os }}-

      - name: Build (bazel build //...)
        run: bazel build --lockfile_mode=error --config=gcc12 --config=${{ matrix.config }} //...

      # Manual targets are skipped by //...; compile the P1 stress binary on
      # PRs without starting its hour-long timed phase.
      - name: Compile manual MPMC stress target
        if: >-
          github.event_name == 'pull_request' &&
          (matrix.config == 'debug' || matrix.config == 'tsan')
        run: |
          bazel build --lockfile_mode=error --config=gcc12 --config=${{ matrix.config }} \
            //mino/shm/channel:mpmc_ring_stress_test

      - name: Verify build did not mutate locked inputs
        run: git --no-pager diff --exit-code -- MODULE.bazel MODULE.bazel.lock .bazelrc

      - name: Test (bazel test //...)
        run: bazel test --lockfile_mode=error --config=gcc12 --config=${{ matrix.config }} //... --test_output=errors

      # V-12 Litmus 报告：显式运行并输出全部日志，作为 Lock-free 验证证据归档
      - name: V-12 Atomic ABI Litmus report
        if: matrix.config == 'debug' || matrix.config == 'release'
        run: |
          bazel test --lockfile_mode=error --config=gcc12 --config=${{ matrix.config }} \
            //tests/litmus:atomic_abi_test \
            --test_output=all --nocache_test_results

  # Downloaded, version-pinned LLVM/Clang. This is separate from the host GCC
  # matrix so the existing compatibility signal remains intact.
  hermetic-build-test:
    name: Hermetic LLVM 18.1.8 (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Hermetic LLVM runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtinfo5

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3

      - name: Cache Bazel output base
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-hermetic-llvm18-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', '.bazelversion') }}
          restore-keys: |
            bazel-${{ runner.os }}-hermetic-llvm18-
            bazel-${{ runner.os }}-

      - name: Query current-platform LLVM toolchain
        run: bazel query --lockfile_mode=error @mino_llvm//:all

      - name: Record actual hermetic Clang compiler version
        run: |
          bazel build --lockfile_mode=error --config=hermetic \
            //tools/ci:hermetic_clang_version
          mkdir -p hermetic-toolchain-evidence
          cp bazel-bin/tools/ci/hermetic-clang-version.txt \
            hermetic-toolchain-evidence/
          cat hermetic-toolchain-evidence/hermetic-clang-version.txt

      - name: Build with hermetic LLVM
        run: bazel build --lockfile_mode=error --config=hermetic --config=debug //...

      - name: Verify build did not mutate locked inputs
        run: git --no-pager diff --exit-code -- MODULE.bazel MODULE.bazel.lock .bazelrc

      - name: Test with hermetic LLVM
        run: bazel test --lockfile_mode=error --config=hermetic --config=debug //... --test_output=errors

      - name: Upload compiler version evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermetic-clang-version-${{ github.run_id }}-${{ github.run_attempt }}
          path: hermetic-toolchain-evidence/
          if-no-files-found: warn
          retention-days: 90

  tooling-smoke:
    name: Extended CI tooling smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python and shell syntax checks
        run: |
          python3 -m compileall -q tools/ci
          bash -n tools/ci/run_d3_codegen_environment.sh

      - name: Runner self-tests
        run: |
          python3 tools/ci/collect_codegen_artifacts.py --self-test
          python3 tools/ci/prepare_d3_fuzz_corpus.py --self-test
          python3 tools/ci/run_d3_codegen_docker_check.py --self-test
          python3 tools/ci/run_d3_fuzz_campaign.py --self-test
          python3 tools/ci/run_d5_storage_fault_campaign.py --self-test
          python3 tools/ci/run_extended_long_test.py --self-test
          python3 tools/ci/run_recovery_stress.py --self-test
          python3 tools/ci/run_tla_validation.py --self-test
          python3 tools/ci/run_two_host_server.py --self-test
          python3 tools/ci/run_two_host_client.py --self-test
          python3 tools/ci/finalize_two_host_manifest.py --self-test

  # -------------------------------------------------------------------------
  # Lint：buildifier 检查 BUILD / .bzl / WORKSPACE 文件格式（可选）
  # 直接下载 bazelbuild/buildtools 官方 release 二进制，不依赖第三方 action
  # -------------------------------------------------------------------------
  lint:
    name: buildifier
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install buildifier
        run: |
          curl -sSL -o buildifier \
            https://github.com/bazelbuild/buildtools/releases/download/v7.3.1/buildifier-linux-amd64
          chmod +x buildifier
          ./buildifier --version

      - name: Run buildifier (check mode)
        run: ./buildifier --mode=check -r .
