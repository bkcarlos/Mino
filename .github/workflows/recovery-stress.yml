# Long-running recovery validation is intentionally separate from PR CI.
name: Reproducible Recovery Stress

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seed:
        description: Optional decimal uint64 seed override (recorded in manifest)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: recovery-stress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery-stress:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CC: gcc-12
      CXX: g++-12
      RECOVERY_STRESS_SECONDS: "7200"
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: region-fixed
            suite: region
            name: Region recovery (2h, fixed seed)
            seed_kind: fixed
            seed: "910009"
          - id: runtime-fixed
            suite: runtime
            name: Runtime recovery (2h, fixed seed)
            seed_kind: fixed
            seed: "920009"
          - id: runtime-run-derived
            suite: runtime
            name: Runtime recovery (2h, run-derived seed)
            seed_kind: run-derived
            seed: ""

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 libatomic1

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3

      - name: Cache Bazel output base
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bazel
          key: recovery-stress-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', '.bazelversion') }}
          restore-keys: |
            recovery-stress-${{ runner.os }}-${{ matrix.id }}-
            recovery-stress-${{ runner.os }}-

      - name: Run reproducible two-hour recovery stress
        env:
          STRESS_SEED: ${{ matrix.seed_kind == 'fixed' && matrix.seed || (inputs.seed || github.run_number) }}
          STRESS_SEED_KIND: ${{ matrix.seed_kind == 'fixed' && 'fixed' || (inputs.seed && 'manual' || 'run-derived') }}
        run: |
          python3 tools/ci/run_recovery_stress.py "${{ matrix.suite }}" \
            --seconds="${RECOVERY_STRESS_SECONDS}" \
            --seed="${STRESS_SEED}" \
            --seed-kind="${STRESS_SEED_KIND}" \
            --expected-commit="${GITHUB_SHA}" \
            --out="recovery-stress-results/${{ matrix.id }}"

      - name: Verify complete recovery stress evidence
        if: always()
        env:
          RESULT_DIR: recovery-stress-results/${{ matrix.id }}
          EXPECTED_SUITE: ${{ matrix.suite }}
          EXPECTED_SEED_KIND: ${{ matrix.seed_kind == 'fixed' && 'fixed' || (inputs.seed && 'manual' || 'run-derived') }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RESULT_DIR"])
          manifest_path = root / "manifest.json"
          if not manifest_path.is_file():
              raise SystemExit("recovery evidence is missing manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["commit"] == os.environ["GITHUB_SHA"].lower()
          assert manifest["expected_commit"] == os.environ["GITHUB_SHA"].lower()
          assert manifest["source_state"] == "clean"
          assert manifest["qualification_eligible"] is True
          assert manifest["suite"] == os.environ["EXPECTED_SUITE"]
          assert manifest["seed_kind"] == os.environ["EXPECTED_SEED_KIND"]
          assert manifest["status"] == "passed"
          assert manifest["outcome"] == "passed"
          assert manifest["exit_code"] == 0
          hashes = manifest["test_log_hashes"]
          for name in ("test.log", "test.xml", "bazel-console.log"):
              artifact = root / name
              assert artifact.is_file()
              assert isinstance(hashes.get(name), str)
              assert hashlib.sha256(artifact.read_bytes()).hexdigest() == hashes[name]
          if manifest["suite"] == "runtime":
              expected_classes = {
                  "publisher_crash", "subscriber_kill", "slow_subscriber",
                  "lease_boundary", "pid_incarnation",
              }
              attempted = manifest["scenario_attempt_counts"]
              completed = manifest["scenario_counts"]
              assert set(attempted) == expected_classes
              assert set(completed) == expected_classes
              for name in expected_classes:
                  assert attempted[name] == completed[name] and completed[name] > 0
              assert manifest["scenario_count_source"] == "test.log"
              cut_attempted = manifest["cutpoint_attempt_counts"]
              cut_completed = manifest["cutpoint_counts"]
              expected_cuts = {
                  "journal-initializing-tagged", "journal-building-published",
                  "journal-allocation-published", "journal-handle-appended",
                  "mpsc-claim-tagged", "mpsc-owner-published",
                  "mpsc-cursor-advanced", "mpsc-writing-published",
                  "mpsc-ready-published", "mpsc-turn-published",
                  "journal-reclaim-tagged", "journal-reclaim-progress",
                  "journal-finalizing-tagged",
              }
              assert set(cut_attempted) == expected_cuts
              assert set(cut_completed) == expected_cuts
              for cut in expected_cuts:
                  assert cut_attempted[cut].keys() == cut_completed[cut].keys()
                  for interruption in cut_attempted[cut]:
                      assert cut_attempted[cut][interruption] == cut_completed[cut][interruption]
                  assert cut_completed[cut]["sigkill"] > 0
              assert manifest["cutpoint_count_source"] == "test.log"
              interruptions = manifest["interruption_counts"]
              assert interruptions["sigstop_live_sigcont"] > 0
              assert (
                  manifest["interruption_attempt_counts"]["sigstop_live_sigcont"]
                  == interruptions["sigstop_live_sigcont"]
              )
          print("recovery evidence integrity: PASS")
          PY

      - name: Write recovery stress summary
        if: always()
        env:
          RESULT_DIR: recovery-stress-results/${{ matrix.id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = Path(os.environ["RESULT_DIR"])
          manifest_path = result / "manifest.json"
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Recovery stress evidence", ""]
          if not manifest_path.is_file():
              lines += ["No manifest was produced; inspect setup and runner logs.", ""]
          else:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              hashes = manifest.get("test_log_hashes", {})
              scenario_counts = manifest.get("scenario_counts", {})
              scenario_summary = ", ".join(
                  f"{name}={count}" for name, count in scenario_counts.items()
              ) or "n/a"
              lines += [
                  "| Field | Value |",
                  "| --- | --- |",
                  f"| Status | `{manifest.get('status')}` |",
                  f"| Suite / target | `{manifest.get('suite')}` / `{manifest.get('target')}` |",
                  f"| Commit | `{manifest.get('commit')}` |",
                  f"| Seed | `{manifest.get('seed')}` |",
                  f"| Requested duration | `{manifest.get('duration_seconds')}s` |",
                  f"| Start | `{manifest.get('start_time_utc')}` |",
                  f"| End | `{manifest.get('end_time_utc')}` |",
                  f"| Exit code | `{manifest.get('exit_code')}` |",
                  f"| Completed scenario counts | `{scenario_summary}` |",
                  f"| Scenario count source | `{manifest.get('scenario_count_source')}` |",
                  f"| test.log SHA-256 | `{hashes.get('test.log')}` |",
                  f"| test.xml SHA-256 | `{hashes.get('test.xml')}` |",
                  "",
                  f"Artifact retention: **90 days**. Artifact source: `{result}`.",
                  "",
              ]
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines))
          PY

      - name: Upload recovery stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-stress-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-stress-results/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 90
