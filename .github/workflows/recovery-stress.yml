# Long-running recovery validation is intentionally separate from PR CI.
name: Reproducible Recovery Stress

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seed:
        description: Optional decimal uint64 seed override (recorded in manifest)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: recovery-stress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery-stress:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      CC: gcc-12
      CXX: g++-12
      RECOVERY_STRESS_SECONDS: "7200"
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: d1
            name: D1 Region recovery (2h)
            seed: "910009"
          - id: d2
            name: D2 Runtime recovery (2h)
            seed: "920009"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 libatomic1

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3

      - name: Cache Bazel output base
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bazel
          key: recovery-stress-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', '.bazelversion') }}
          restore-keys: |
            recovery-stress-${{ runner.os }}-${{ matrix.id }}-
            recovery-stress-${{ runner.os }}-

      - name: Run reproducible two-hour recovery stress
        env:
          STRESS_SEED: ${{ inputs.seed || matrix.seed }}
        run: |
          python3 tools/ci/run_recovery_stress.py "${{ matrix.id }}" \
            --seconds="${RECOVERY_STRESS_SECONDS}" \
            --seed="${STRESS_SEED}" \
            --out="recovery-stress-results/${{ matrix.id }}"

      - name: Write recovery stress summary
        if: always()
        env:
          RESULT_DIR: recovery-stress-results/${{ matrix.id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = Path(os.environ["RESULT_DIR"])
          manifest_path = result / "manifest.json"
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Recovery stress evidence", ""]
          if not manifest_path.is_file():
              lines += ["No manifest was produced; inspect setup and runner logs.", ""]
          else:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              hashes = manifest.get("test_log_hashes", {})
              lines += [
                  "| Field | Value |",
                  "| --- | --- |",
                  f"| Status | `{manifest.get('status')}` |",
                  f"| Suite / target | `{manifest.get('suite')}` / `{manifest.get('target')}` |",
                  f"| Commit | `{manifest.get('commit')}` |",
                  f"| Seed | `{manifest.get('seed')}` |",
                  f"| Requested duration | `{manifest.get('duration_seconds')}s` |",
                  f"| Start | `{manifest.get('start_time_utc')}` |",
                  f"| End | `{manifest.get('end_time_utc')}` |",
                  f"| Exit code | `{manifest.get('exit_code')}` |",
                  f"| test.log SHA-256 | `{hashes.get('test.log')}` |",
                  f"| test.xml SHA-256 | `{hashes.get('test.xml')}` |",
                  "",
                  f"Artifact retention: **90 days**. Artifact source: `{result}`.",
                  "",
              ]
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines))
          PY

      - name: Upload recovery stress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-stress-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-stress-results/${{ matrix.id }}/
          if-no-files-found: warn
          retention-days: 90
